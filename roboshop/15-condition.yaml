- name: print eve or odd
  hosts: local
  connection: local
  gather_facts: true
  tasks:
    - name: print the os
      debug:
        msg: "Os is Redhat"
      when: ansible_facts.os_family=="RedHat"
    - name: install nginx
      dnf:
        name: nginx
        state: present
      when: ansible_facts.os_family=="RedHat"
