- name: Print Data Types
  hosts: local
  connection: local
  become: yes

  vars:
    course: "AIOps with DevOps"
    duration_in_months: 4
    is_live_session: true
    packages:
      - nginx
      - mongodb
      - mysql
    more_details:
      trainer: Arjun
      months: 4
    exact_duration: 4.5

  tasks:
    - name: Print variable values and data types
      ansible.builtin.debug:
        msg: |
          Course           : {{ course }} ({{ course | type_debug }})
          Duration         : {{ duration_in_months }} ({{ duration_in_months | type_debug }})
          Live Session     : {{ is_live_session }} ({{ is_live_session | type_debug }})
          Packages         : {{ packages }} ({{ packages | type_debug }})
          More Details     : {{ more_details }} ({{ more_details | type_debug }})
          Exact Duration   : {{ exact_duration }} ({{ exact_duration | type_debug }})
