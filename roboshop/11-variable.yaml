- name: multiple variable check
  hosts: frontend
  become: yes

  vars:
    course: "ansible from play"

  vars_files:
    - course.yaml

  vars_prompt:
    - name: course
      prompt: "Please enter course"
      private: false

  tasks:
    - name: print the course
      vars:
        course: "ansible from tasks"
      debug:
        msg: "Print the course: {{ course }}"
