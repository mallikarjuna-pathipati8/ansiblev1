- name: print eve or odd
  hosts: local
  connection: local
  become: yes
  gather_facts: true

  vars:
    packages:
      - { name:'nginx', state:'absent' }
      - { name:'mysql', state:'present' }
      - { name:'htop', state:'absent' }

  tasks:
    - name: Install Packages
      package:
        name: "{{item.name}}"
        state: "{{item.state}}"
      loop: "{{packages}}"
